name: CI

on:
  pull_request:
  push:
    branches: [main]

# Fork PRs get a read-only token; nothing here needs more.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck and test
        run: npm run verify
      - name: Validate the plugin manifest
        run: npx --yes @anthropic-ai/claude-code plugin validate --strict .claude-plugin/plugin.json
