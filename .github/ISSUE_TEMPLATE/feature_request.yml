name: Idea or improvement
description: Suggest a new stack reference, a better template, or a change to a phase
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What does Forge get wrong or leave out today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: Which phase or reference it touches, and how it should behave
    validations:
      required: true
